<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Circular outer gold ring -->
  <circle cx="32" cy="32" r="30" stroke="#E9B83F" stroke-width="2.5" fill="#0B2E1B"/>
  <circle cx="32" cy="32" r="27.5" stroke="#087A35" stroke-width="1.2" stroke-dasharray="2 1" fill="none"/>
  
  <!-- Golden Sun -->
  <g transform="translate(32, 22)">
    <!-- Sun Rays -->
    <path d="M0 -11 L0 -14" stroke="#E9B83F" stroke-width="2" stroke-linecap="round"/>
    <path d="M7 -7 L10 -10" stroke="#E9B83F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M11 0 L14 0" stroke="#E9B83F" stroke-width="2" stroke-linecap="round"/>
    <path d="M-7 -7 L-10 -10" stroke="#E9B83F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-11 0 L-14 0" stroke="#E9B83F" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 -9.5 L7.5 -12.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-5 -9.5 L-7.5 -12.5" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="7.5" fill="url(#sunGrad)"/>
  </g>

  <!-- Napier Leaves & Green Energy -->
  <g>
    <!-- Left Leaf -->
    <path d="M32 47 C24 43 14 36 17 23 C22 25 28 31 32 39" fill="url(#leafGrad1)"/>
    <!-- Right Leaf -->
    <path d="M32 47 C40 43 50 36 47 23 C42 25 36 31 32 39" fill="url(#leafGrad2)"/>
    <!-- Center Leaf Sprout / Biogas Energy Core -->
    <path d="M32 48 C30 40 30 30 32 20 C34 30 34 40 32 48" fill="#10A86B"/>
    <!-- Stem Base -->
    <path d="M32 46 L32 53" stroke="#65A30D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="sunGrad" x1="0" y1="-8" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#E9B83F"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="16" y1="23" x2="32" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="60%" stop-color="#087A35"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="48" y1="23" x2="32" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10A86B"/>
      <stop offset="60%" stop-color="#087A35"/>
      <stop offset="100%" stop-color="#0B2E1B"/>
    </linearGradient>
  </defs>
</svg>